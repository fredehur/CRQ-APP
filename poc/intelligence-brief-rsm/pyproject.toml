[project]
name = "intelligence-brief-rsm"
version = "0.1.0"
description = "RSM-grade regional intelligence brief pipeline — Seerist + OSINT ingestion, agent enrichment, deterministic render. Multi-region (APAC / AME / LATAM / MED / NCE) with org-grounded or region-guided modes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.84.0",
    "firecrawl-py>=4.22.1",
    "fpdf2>=2.8.7",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "playwright>=1.58.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "tavily-python>=0.7.23",
    "truststore>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
